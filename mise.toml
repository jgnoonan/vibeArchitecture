# Tools for this repository's own checks (scripts/check.sh and .github/workflows/validate.yml).
# `mise install` installs them locally; CI uses jdx/mise-action with this file.
# Keep versions in step with checks/templates/mise.toml.
[tools]
gitleaks = "8.30.1"
osv-scanner = "2.6.0"
semgrep = "1.178.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
shellcheck = "0.11.0"
uv = "0.12.19"
