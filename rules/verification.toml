# Verification matrix for rules/*.md. One entry per top-level rule bullet.
#
# Every rule says how compliance is verified. `scripts/verify-matrix.py` fails
# CI when a bullet has no entry, an entry matches no bullet, a "pattern" rule
# has no Semgrep rule citing it, or a check id is not in checks/catalog.toml.
#
# id      stable; never renumber. New bullets take the next free number.
# match   the start of the bullet text (markdown stripped); must be unique in its file.
# verify  one or more of:
#           tool      an off-the-shelf scanner in the check command (see `checks`)
#           pattern   a rule in checks/semgrep/ cites this id in metadata.va_rules
#           test      a test the project writes (behavioural or invariant; see `checks`)
#           runtime   checked against a running environment (post-deploy or scheduled)
#           review    needs judgment: code review / AI review gate
#           attest    a setting or process outside the code; record it in the register
#           guidance  explanatory; nothing to verify
# checks  ids from checks/catalog.toml that provide the tool/test/runtime evidence
# tier    only when the bullet applies from a higher tier than its file

