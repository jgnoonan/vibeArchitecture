# Tool versions for the vibeArchitecture checks. `mise install` installs exactly these;
# CI uses jdx/mise-action with this same file, so local and CI runs match.
# Bump deliberately (Renovate can keep mise.toml current). You can pin your
# own toolchain (node, python, go...) here too.
[tools]
gitleaks = "8.30.1"
osv-scanner = "2.6.0"
semgrep = "1.178.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
uv = "0.12.19"  # mise installs semgrep through uv
